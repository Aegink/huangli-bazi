name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # 没有任何第三方依赖，不需要 npm install
      - name: 校验 index.html 与 src/ 是否同步
        run: node tools/build.js --check
      - name: 跑历法 / 规则 / 渲染 / 工程约束 / 构建同步五组断言
        run: node tests/run.js
